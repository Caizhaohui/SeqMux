[package]
name = "seqmux"
version = "0.1.1"
edition = "2021"
description = "SeqMux — fast, portable FASTQ demultiplexer inspired by Ultraplex"
license = "MIT"
authors = ["Caizhaohui"]
repository = "https://github.com/Caizhaohui/SeqMux"
readme = "README.md"
keywords = ["fastq", "demultiplex", "barcode", "bioinformatics", "ngs"]
categories = ["command-line-utilities", "science"]
rust-version = "1.74"

[[bin]]
name = "seqmux"
path = "src/main.rs"

[lib]
name = "seqmux"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
flate2 = "1"
needletail = "0.6"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
